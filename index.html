<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOB BASE</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#768197;--line:#e5e9f1;--nav:#111827;--a:#5b5ce2;--soft:#efefff;--ok:#21875f;--bad:#c34e58}*{box-sizing:border-box}body{margin:0;font-family:Inter,Pretendard,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 80% 0,#ececff,transparent 28%),var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{background:linear-gradient(180deg,#111827,#172033);color:white;padding:26px 18px}.brand{font-size:18px;font-weight:900;letter-spacing:.08em;margin:0 8px 28px}.brand small{display:block;font-size:11px;color:#9aa5b8;font-weight:500;margin-top:4px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#aab3c3;padding:12px;border-radius:12px;text-align:left;cursor:pointer}.nav button.active,.nav button:hover{background:#252c48;color:white}.main{max-width:1400px;width:100%;padding:38px 42px 70px;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;margin-bottom:24px}.top h1{margin:4px 0;font-size:30px}.sub{color:var(--muted);font-size:12px}.eyebrow{color:var(--a);font-size:10px;font-weight:900;letter-spacing:.14em}.view{display:none}.view.active{display:block}.hero{background:linear-gradient(120deg,#30378a,#5b5ce2 60%,#7c6ce7);color:#fff;padding:28px;border-radius:24px;margin-bottom:18px;box-shadow:0 20px 50px #4d52d72c}.hero h2{font-size:25px;margin:6px 0}.hero p{color:#e7e7ff}.grid{display:grid;gap:15px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 12px 35px #1d29400d}.metric span{color:var(--muted);font-size:11px}.metric strong{display:block;font-size:28px;margin:10px 0}.section{margin:26px 0 12px}.section h2{font-size:16px;margin:0}.btn{border:1px solid var(--line);background:white;padding:9px 12px;border-radius:11px;cursor:pointer}.primary{background:var(--a);color:white;border-color:var(--a)}.soft{background:var(--soft);color:var(--a);border:0}.danger{background:#fff0f1;color:var(--bad);border:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:10px;font-weight:800;color:var(--muted)}input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}textarea{min-height:120px;resize:vertical}.tabs{display:flex;gap:5px;padding:5px;background:#eceff4;border-radius:13px;width:max-content;max-width:100%;overflow:auto;margin-bottom:17px}.tabs button{border:0;background:transparent;padding:8px 11px;border-radius:9px;color:var(--muted);font-weight:800;font-size:11px;cursor:pointer}.tabs button.active{background:#fff;color:var(--a)}.panel{display:none}.panel.active{display:block}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--a);font-size:10px;font-weight:800}.progress{height:7px;background:#edf0f5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--a)}.quiz{display:grid;grid-template-columns:.7fr 1.3fr;gap:10px;padding:12px;border:1px solid var(--line);border-radius:13px;margin:8px 0}.word{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.score{font-size:44px;font-weight:900;color:var(--a)}.check{padding:9px 11px;border-radius:10px;margin:7px 0;font-size:11px;background:#eaf8f1;color:var(--ok)}.check.no{background:#fff3df;color:#8c621b}.history{border:1px solid var(--line);border-radius:13px;padding:13px;margin:9px 0}.empty{color:var(--muted);text-align:center;padding:24px;border:1px dashed #d9dfe8;border-radius:13px;font-size:12px}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;padding:11px 13px;border-radius:10px;font-size:11px;display:none}@media(max-width:900px){.app{grid-template-columns:1fr}.nav{grid-template-columns:repeat(4,1fr)}.side{padding:18px}.main{padding:28px 18px 60px}.g4{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.g4,.g2,.row,.quiz{grid-template-columns:1fr}.nav{grid-template-columns:repeat(2,1fr)}.top{display:block}.word{grid-template-columns:1fr auto}.word span{grid-column:1}}
</style></head><body><div class="app"><aside class="side"><div class="brand">JOB BASE<small>개인 취업 준비실</small></div><div id="nav" class="nav"><button class="active" data-v="dash">⌂ 대시보드</button><button data-v="english">A+ 영어 학습</button><button data-v="career">◎ 취업 관리</button><button data-v="settings">⚙ 설정</button></div></aside><main class="main"><header class="top"><div><div class="eyebrow">CAREER COMMAND CENTER</div><h1 id="title">취업 준비 대시보드</h1><div class="sub" id="desc">목표, 영어 학습, 지원 현황을 한 곳에서 관리합니다.</div></div><div class="sub" id="date"></div></header><section id="dash" class="view active"></section><section id="english" class="view"></section><section id="career" class="view"></section><section id="settings" class="view"></section></main></div><div id="toast" class="toast"></div><script>
const K='job-base-web-v1',U=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),D=()=>new Date().toISOString().slice(0,10),clone=x=>JSON.parse(JSON.stringify(x));const base={goals:[{id:U(),name:'공기업 취업 준비',target:'2027 상반기',progress:20}],apps:[],words:[['apply','지원하다'],['applicant','지원자'],['qualification','자격요건'],['requirement','요건'],['deadline','마감일'],['recruit','채용하다'],['position','직무'],['experience','경험'],['achievement','성과'],['responsibility','책임'],['collaborate','협업하다'],['improve','개선하다'],['efficient','효율적인'],['reliable','신뢰할 수 있는'],['evaluate','평가하다'],['conduct','수행하다'],['maintain','유지하다'],['resolve','해결하다'],['priority','우선순위'],['available','이용 가능한']].map(x=>({id:U(),w:x[0],m:x[1]})),quiz:[],sent:[]};let s;try{s=Object.assign(clone(base),JSON.parse(localStorage.getItem(K)||'{}'))}catch{s=clone(base)}let tab='quiz',q=null,ev=null;const $=x=>document.querySelector(x),E=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(K,JSON.stringify(s));render()}function toast(x){$('#toast').textContent=x;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',1500)}
function dash(){const t=s.quiz.find(x=>x.date===D()),w=s.sent.filter(x=>x.date===D()).length,avg=s.goals.length?Math.round(s.goals.reduce((a,b)=>a+(+b.progress||0),0)/s.goals.length):0;$('#dash').innerHTML=`<div class="hero"><div class="eyebrow" style="color:#d9d7ff">TODAY'S PLAN</div><h2>오늘 해야 할 준비를 한 곳에서.</h2><p>취업 준비와 매일 영어 훈련을 끊기지 않게 기록하세요.</p><button class="btn" onclick="go('english')">오늘 영단어 시험</button></div><div class="grid g4">${m('목표 진행률',avg+'%','등록 목표 '+s.goals.length+'개')}${m('지원 현황',s.apps.length+'건','기업·기관 관리')}${m('오늘 영단어',t?t.score+'점':'미응시',t?t.correct+'/'+t.total+' 정답':'시험 시작하기')}${m('오늘 문장',w+'회','직접 작성·평가')}</div><div class="section"><h2>핵심 목표</h2></div><div class="grid g2">${s.goals.map(g=>`<div class="card"><b>${E(g.name)}</b><span class="badge" style="float:right">${g.progress}%</span><p class="sub">${E(g.target)}</p><div class="progress"><i style="width:${g.progress}%"></i></div></div>`).join('')}</div>`}function m(a,b,c){return `<div class="card metric"><span>${a}</span><strong>${b}</strong><span>${c}</span></div>`}
function english(){ $('#english').innerHTML=`<div class="tabs">${['quiz','words','write','history'].map((x,i)=>`<button class="${tab===x?'active':''}" onclick="tab='${x}';english()">${['오늘의 시험','내 단어장','문장 작성','기록'][i]}</button>`).join('')}</div><div class="panel ${tab==='quiz'?'active':''}">${quizP()}</div><div class="panel ${tab==='words'?'active':''}">${wordsP()}</div><div class="panel ${tab==='write'?'active':''}">${writeP()}</div><div class="panel ${tab==='history'?'active':''}">${histP()}</div>`}
function quizP(){if(q)return `<div class="card"><h2>영단어 시험</h2>${q.items.map((x,i)=>`<div class="quiz"><b>${i+1}. ${E(x.p)}</b><div><input id="a${i}" placeholder="정답 입력"><div id="r${i}" class="sub"></div></div></div>`).join('')}<button class="btn primary" onclick="grade()">채점하기</button></div>`;const t=s.quiz.find(x=>x.date===D());return `<div class="grid g2"><div class="card"><h2>오늘의 영단어 시험</h2><div class="row"><div class="field"><label>문제 수</label><select id="cnt"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div><div class="field"><label>방향</label><select id="dir"><option value="ek">영어 → 한국어</option><option value="ke">한국어 → 영어</option></select></div></div><button class="btn primary" onclick="start()">시험 시작</button></div><div class="card"><div class="sub">오늘 기록</div><div class="score">${t?t.score:'-'}</div><p>${t?t.correct+'/'+t.total+' 정답':'아직 응시하지 않았습니다.'}</p></div></div>`}function start(){let n=Math.min(+$(`#cnt`).value,s.words.length),d=$('#dir').value,a=[...s.words].sort(()=>Math.random()-.5).slice(0,n);q={items:a.map(x=>({p:d==='ek'?x.w:x.m,a:d==='ek'?x.m:x.w}))};english()}function norm(x){return x.toLowerCase().replace(/[.,!?]/g,'').trim()}function grade(){let c=0,wrong=[];q.items.forEach((x,i)=>{let y=$('#a'+i).value.trim(),ok=norm(x.a).split(/[,/]/).some(z=>norm(z)===norm(y));if(ok)c++;else wrong.push({p:x.p,a:x.a,y});$('#r'+i).innerHTML=ok?'<span style="color:var(--ok)">✓ 정답</span>':'<span style="color:var(--bad)">✕ '+E(x.a)+'</span>'});let r={id:U(),date:D(),score:Math.round(c/q.items.length*100),correct:c,total:q.items.length,wrong};s.quiz.unshift(r);q=null;save();toast('채점 완료 · '+r.score+'점')}
function wordsP(){return `<div class="grid g2"><div class="card"><h2>단어 추가</h2><div class="field"><label>영단어</label><input id="nw"></div><div class="field"><label>뜻</label><input id="nm"></div><button class="btn primary" onclick="addW()">추가</button><div class="section"><h2>여러 개 추가</h2></div><textarea id="bulk" placeholder="deadline = 마감일\nreliable = 신뢰할 수 있는"></textarea><button class="btn soft" onclick="bulk()">한꺼번에 추가</button></div><div class="card"><h2>내 단어장 <span class="badge">${s.words.length}</span></h2>${s.words.map(x=>`<div class="word"><b>${E(x.w)}</b><span class="sub">${E(x.m)}</span><button class="btn danger" onclick="delW('${x.id}')">삭제</button></div>`).join('')}</div></div>`}function addW(){if(!$('#nw').value.trim()||!$('#nm').value.trim())return;s.words.unshift({id:U(),w:$('#nw').value.trim(),m:$('#nm').value.trim()});save()}function bulk(){let n=0;$('#bulk').value.split('\n').forEach(l=>{let p=l.split('=');if(p.length>1&&p[0].trim()&&p.slice(1).join('=').trim()){s.words.unshift({id:U(),w:p[0].trim(),m:p.slice(1).join('=').trim()});n++}});save();toast(n+'개 추가')}function delW(id){s.words=s.words.filter(x=>x.id!==id);save()}
const prompts=['Describe your evening routine in 2–3 sentences.','Write about why you want to work at a public company.','Describe a strength you can use at work.','Write about how you handle a difficult task.','Describe what you studied today.'];function writeP(){let p=prompts[new Date().getDate()%prompts.length];return `<div class="grid g2"><div class="card"><span class="badge">TODAY'S WRITING</span><h2>${p}</h2><textarea id="text" placeholder="Write your sentence here..."></textarea><button class="btn primary" onclick="evaluate()">문장 평가</button></div><div class="card">${ev?evalH():`<div class="empty">문장을 작성하고 평가 버튼을 누르세요.</div>`}</div></div>`}function evaluate(){let t=$('#text').value.trim();if(!t)return toast('문장을 작성하세요.');let score=100,c=[];function ck(ok,msg,loss){c.push({ok,msg});if(!ok)score-=loss}let ws=t.match(/[A-Za-z']+/g)||[];ck(/^[A-Z]/.test(t),'대문자로 시작',10);ck(/[.!?]$/.test(t),'문장부호로 끝남',8);ck(ws.length>=6,'6단어 이상 작성',8);ck(!/\bi\b/.test(t),'1인칭 I 대문자 사용',12);ck(/\b(am|is|are|was|were|have|has|do|does|did|can|will|would|should|go|make|work|study|like|want|need|prefer|think|feel|use|apply|prepare|learn|finish|eat|take|help)\b|\b[a-z]+(ed|ing|s)\b/i.test(t),'기본 동사 구조 확인',12);ev={text:t,score,c};english()}function evalH(){return `<div class="score">${ev.score}</div><div class="sub">기초 자동평가</div>${ev.c.map(x=>`<div class="check ${x.ok?'':'no'}">${x.ok?'✓':'!'} ${x.msg}</div>`).join('')}<div class="row"><div class="field"><label>문법 자신감 1~5</label><input id="gram" type="number" min="1" max="5" value="3"></div><div class="field"><label>자연스러움 1~5</label><input id="nat" type="number" min="1" max="5" value="3"></div></div><div class="field"><label>수정 메모</label><textarea id="note"></textarea></div><button class="btn soft" onclick="saveS()">기록 저장</button>`}function saveS(){s.sent.unshift({id:U(),date:D(),text:ev.text,score:ev.score,grammar:+$('#gram').value,natural:+$('#nat').value,note:$('#note').value});ev=null;save();toast('문장 기록 저장')}
function histP(){return `<div class="grid g2"><div class="card"><h2>영단어 시험 기록</h2>${s.quiz.length?s.quiz.slice(0,20).map(x=>`<div class="history"><b>${x.date}</b><div class="score" style="font-size:27px">${x.score}</div><span class="sub">${x.correct}/${x.total} 정답</span></div>`).join(''):'<div class="empty">기록 없음</div>'}</div><div class="card"><h2>문장 작성 기록</h2>${s.sent.length?s.sent.slice(0,20).map(x=>`<div class="history"><b>${x.date} · ${x.score}점</b><p>${E(x.text)}</p><div class="sub">문법 ${x.grammar}/5 · 자연스러움 ${x.natural}/5</div>${x.note?'<p class="sub">'+E(x.note)+'</p>':''}</div>`).join(''):'<div class="empty">기록 없음</div>'}</div></div>`}
function career(){ $('#career').innerHTML=`<div class="grid g2"><div class="card"><h2>목표 추가</h2><div class="field"><label>목표</label><input id="gn"></div><div class="row"><div class="field"><label>목표 시점</label><input id="gt"></div><div class="field"><label>진행률</label><input id="gp" type="number" min="0" max="100" value="0"></div></div><button class="btn primary" onclick="addG()">추가</button></div><div class="card"><h2>지원 현황 추가</h2><div class="field"><label>기업/기관</label><input id="ac"></div><div class="field"><label>직무</label><input id="aj"></div><div class="row"><input id="ad" type="date"><select id="as"><option>관심</option><option>지원완료</option><option>필기</option><option>면접</option><option>최종합격</option></select></div><br><button class="btn primary" onclick="addA()">추가</button></div></div><div class="section"><h2>목표</h2></div><div class="grid g2">${s.goals.map(g=>`<div class="card"><b>${E(g.name)}</b><span class="badge" style="float:right">${g.progress}%</span><p class="sub">${E(g.target)}</p><div class="progress"><i style="width:${g.progress}%"></i></div><br><button class="btn soft" onclick="upG('${g.id}')">+10%</button> <button class="btn danger" onclick="delG('${g.id}')">삭제</button></div>`).join('')}</div><div class="section"><h2>지원 현황</h2></div>${s.apps.length?s.apps.map(a=>`<div class="history"><b>${E(a.company)}</b> <span class="badge">${E(a.status)}</span><p class="sub">${E(a.job)} · ${E(a.date)}</p><button class="btn danger" onclick="delA('${a.id}')">삭제</button></div>`).join(''):'<div class="empty">지원 기록 없음</div>'}`}function addG(){if(!$('#gn').value.trim())return;s.goals.push({id:U(),name:$('#gn').value.trim(),target:$('#gt').value.trim(),progress:+$('#gp').value||0});save()}function upG(id){let g=s.goals.find(x=>x.id===id);g.progress=Math.min(100,(+g.progress||0)+10);save()}function delG(id){s.goals=s.goals.filter(x=>x.id!==id);save()}function addA(){if(!$('#ac').value.trim())return;s.apps.unshift({id:U(),company:$('#ac').value.trim(),job:$('#aj').value.trim(),date:$('#ad').value,status:$('#as').value});save()}function delA(id){s.apps=s.apps.filter(x=>x.id!==id);save()}
function settings(){ $('#settings').innerHTML=`<div class="grid g2"><div class="card"><h2>데이터 백업</h2><p class="sub">현재 브라우저의 기록을 JSON으로 저장할 수 있습니다.</p><button class="btn primary" onclick="backup()">JSON 백업</button> <label class="btn">복원<input hidden type="file" accept="application/json" onchange="restore(event)"></label></div><div class="card"><h2>초기화</h2><p class="sub">현재 브라우저의 모든 기록을 기본 상태로 되돌립니다.</p><button class="btn danger" onclick="reset()">전체 초기화</button></div></div><div class="section"><p class="sub">현재 데이터는 이 브라우저에 저장됩니다. 휴대폰·PC 자동 동기화는 추후 로그인/클라우드 저장 기능으로 확장할 수 있습니다.</p></div>`}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='job-base-'+D()+'.json';a.click()}function restore(e){let r=new FileReader();r.onload=()=>{try{s=JSON.parse(r.result);save();toast('복원 완료')}catch{toast('올바른 파일이 아닙니다')}};r.readAsText(e.target.files[0])}function reset(){if(confirm('모든 기록을 초기화할까요?')){s=clone(base);save()}}
const meta={dash:['취업 준비 대시보드','목표, 영어 학습, 지원 현황을 한 곳에서 관리합니다.'],english:['English Daily Lab','매일 영단어 시험과 직접 문장 작성·평가를 기록합니다.'],career:['취업 관리','목표와 지원 현황을 관리합니다.'],settings:['설정','백업과 데이터 관리를 할 수 있습니다.']};function go(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.v===v));$('#title').textContent=meta[v][0];$('#desc').textContent=meta[v][1];if(v==='english')english();if(v==='career')career();if(v==='settings')settings()}document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));function render(){dash();english();career();settings()}$('#date').textContent=new Intl.DateTimeFormat('ko-KR',{dateStyle:'full'}).format(new Date());render();
</script></body></html>
